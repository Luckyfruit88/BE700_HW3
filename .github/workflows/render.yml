name: Render HW3 report
on:
  push:
    paths: ["HW3.Rmd", "data/**", ".github/workflows/render.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    container: rocker/verse:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Install R packages
        run: Rscript -e 'install.packages(c("pheatmap","ggrepel","cluster"), repos="https://cloud.r-project.org")'
      - name: Install LaTeX packages
        run: |
          for p in booktabs footnotehyper mdwtools framed xurl bookmark upquote microtype parskip fancyvrb etoolbox lm geometry hyperref amsmath selnolig; do
            tlmgr install "$p" || echo "skip $p"
          done
      - name: Render R Markdown to PDF
        run: Rscript -e 'rmarkdown::render("HW3.Rmd", output_dir = "output")' && cp -r results output/
      - uses: actions/upload-artifact@v4
        with:
          name: HW3-report
          path: output/
      - name: Commit rendered PDF
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add output
          git commit -m "Render HW3.pdf [skip ci]" || echo "no changes"
          git push
