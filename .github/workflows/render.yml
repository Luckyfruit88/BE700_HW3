name: Render HW3 report
on:
  push:
    paths: ["HW3.Rmd", "data/**", "scripts/**", ".github/workflows/render.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    container: rocker/verse:4.4.1
    steps:
      - uses: actions/checkout@v5
      - name: Install R packages
        run: Rscript -e 'install.packages(c("pheatmap","ggrepel","cluster"), repos="https://cloud.r-project.org")'
      - name: Install LaTeX packages
        run: |
          tlmgr install booktabs footnotehyper mdwtools framed xurl bookmark upquote microtype parskip fancyvrb fvextra lineno etoolbox lm geometry hyperref amsmath selnolig
          for style in fvextra.sty lineno.sty; do
            kpsewhich "$style"
          done
      - name: Render and validate R Markdown
        run: Rscript --vanilla scripts/render_validate.R
      - uses: actions/upload-artifact@v5
        with:
          name: HW3-report
          path: |
            output/HW3.pdf
            output/results/
            output/validation.txt
            output/sessionInfo.txt
      - name: Commit validated outputs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add output/HW3.pdf output/results output/validation.txt output/sessionInfo.txt
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Render and validate HW3.pdf [skip ci]"
            git push
          fi
